# Render Blueprint for the Talyn backend (API only — no frontend deployed).
#
# Dashboard > New > Blueprint > point at this repo. Render provisions the web
# service from here; values marked `sync: false` are entered by hand once in
# the dashboard and never live in git.
#
# Postgres is NOT provisioned here on purpose: Render's free database expires
# 30 days after creation and is then deleted. Use Supabase (free, pauses but
# never deletes) and paste its *direct* connection string (port 5432, not the
# pooler) as DATABASE_URL — the app normalizes the scheme, so pasting the
# dashboard value just works. Migrations run inside the container on boot.
services:
  - type: web
    name: talyn-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: DEBUG
        # Quoted on purpose: bare `false` is a YAML boolean, and Render's
        # schema requires an env var value to be a string or number.
        value: "false"
      # Fresh value generated by Render. Never reuse a secret that sat in a
      # file — rotating it invalidates every issued JWT, so set it once.
      - key: SECRET_KEY
        generateValue: true
      # Supabase > project > Connect > direct connection string.
      - key: DATABASE_URL
        sync: false
      # Resend > API Keys. SMTP ports are blocked on Render free, so email
      # goes over HTTPS instead — same templates, same logging.
      - key: RESEND_API_KEY
        sync: false
      # Must be verified in the Resend dashboard (Domains), or Resend rejects
      # it. Until then, only the Resend account's own address receives mail.
      - key: SMTP_FROM
        value: Talyn <no-reply@talyn.dev>
      # Where email links and Paystack redirects point. The UI runs on Vercel;
      # these are origins, so no trailing slash.
      - key: FRONTEND_URL
        value: https://talyn-frontend.vercel.app
      - key: PAYMENT_RETURN_URL
        value: https://talyn-frontend.vercel.app
      # Every browser call is cross-origin here, so this list is load-bearing:
      # an origin missing from it gets a CORS rejection, not data. localhost is
      # kept so the UI can also be run locally against the deployed API.
      - key: CORS_ORIGINS
        value: https://talyn-frontend.vercel.app,http://localhost:3000
      # Paystack test key (sk_test_...) while wiring up; live key only when
      # deliberately taking real money.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ALLOW_STUB_PAYMENTS
        # Quoted for the same reason as DEBUG above. Must stay false: true
        # would let every purchase succeed without collecting money.
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Object storage comes later (Cloudflare R2 recommended — free egress
      # for video). Empty = uploads fail closed, everything else works.
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      # Blank on purpose, and it must stay blank. The app's default is
      # AES256, which is right for AWS S3 and wrong for Cloudflare R2: R2
      # rejects a presigned POST carrying x-amz-server-side-encryption, so
      # the default fails every upload. R2 encrypts at rest anyway, so there
      # is nothing to gain by sending it. Pinned here rather than set in the
      # dashboard, so a Blueprint sync cannot quietly restore the default.
      - key: S3_SERVER_SIDE_ENCRYPTION
        value: ""
      # Empty = in-memory rate limiter, correct on a single instance.
      - key: REDIS_URL
        sync: false
